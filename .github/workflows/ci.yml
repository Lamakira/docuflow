####
# Continuous integration (#25, ADR-0017 Phase 1).
#
# Two jobs on every push to main and every pull request:
#
#   test   install, typecheck, build, then the harness from #19 and the
#          characterization suites from #20 against a real PostgreSQL — so the
#          frozen legacy contract is checked continuously through the migration
#          phases.
#   image  build the Dockerfile. Nothing is pushed anywhere: this repository has
#          no deployment target yet, and under ADR-0018 it never gets production
#          credentials or URLs. The job proves the image still builds.
#
# The database is a service container rather than docker-compose.test.yml: the
# image, credentials, and port are the same, but a service container is already
# healthy before the first step runs. Keep the two in step.
#
# This file replaces the earlier test.yml — same job, same service container,
# with the typecheck, build, and image steps #25 added around it.
####

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      test-db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: docuflow_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d docuflow_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # package-lock.json was written by npm 11, which leaves the esbuild peer of
      # vitest's nested vite for the installer to resolve. The npm 10 bundled with
      # node 22 rejects that as "Missing: @esbuild/...@0.28.1 from lock file".
      # Match the toolchain the lockfile came from instead of loosening npm ci.
      # The Dockerfile does the same, for the same reason.
      - run: npm install --global npm@11

      - run: npm ci

      - name: Typecheck
        run: npm run check

      # The same client and server build the image runs, on the host: a failure
      # here names the file and line, where the same failure inside `docker
      # build` arrives wrapped in build output.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test
        env:
          # Same URL tests/test-db-url.ts defaults to; set explicitly so a
          # change to the service port fails loudly here instead of silently
          # falling back.
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/docuflow_test

  image:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Layer cache keyed by the Actions cache, so an unchanged package-lock.json
      # reuses the two `npm ci` layers — the only slow part of the build.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          # Built and discarded: nothing in CI runs the image yet, and loading it
          # into the runner's daemon would copy a gigabyte for no reader.
          load: false
          tags: docuflow:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
