####
# Continuous integration (#25, ADR-0017 Phase 1).
#
# Two jobs on every push to main and every pull request:
#
#   test   install, typecheck, build, then the harness from #19 and the
#          characterization suites from #20 against a real PostgreSQL — so the
#          frozen legacy contract is checked continuously through the migration
#          phases.
#   image  build the Dockerfile. Nothing is pushed anywhere: this repository has
#          no deployment target yet, and under ADR-0018 it never gets production
#          credentials or URLs. The job proves the image still builds.
#
# The database is a service container rather than docker-compose.test.yml, but
# every setting the compose file makes is made here too — image, credentials,
# port, healthcheck, and the tmpfs data directory — because a service container
# is already healthy before the first step runs. Keep the two in step.
#
# This file replaces the earlier test.yml — same job, same service container,
# with the typecheck, build, and image steps #25 added around it.
####

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      test-db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: docuflow_test
        ports:
          - 5433:5432
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -U postgres -d docuflow_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    steps:
      - uses: actions/checkout@v4

      # Pinned to the exact version the image ships, not the '22' line: a floating
      # major would typecheck, build, and test on a different 22.x than production
      # runs. The `ARG NODE_VERSION` in the Dockerfile is the other copy of this
      # fact — bump both together, and #38 owns collapsing them into one.
      - uses: actions/setup-node@v4
        with:
          node-version: '22.21.1'
          cache: npm

      # package-lock.json was written by npm 11, which leaves the esbuild peer of
      # vitest's nested vite for the installer to resolve. The npm 10 bundled with
      # node 22 rejects that as "Missing: @esbuild/...@0.28.1 from lock file".
      # Match the toolchain the lockfile came from instead of loosening npm ci.
      # The Dockerfile does the same, for the same reason.
      #
      # Temporary (ADR-0017): #38 owns removing this, gated on `npm ci` succeeding
      # on the npm the runner and base image already ship.
      - run: npm install --global npm@11

      - run: npm ci

      - name: Typecheck
        run: npm run check

      # The same client and server build the image runs, on the host: a failure
      # here names the file and line, where the same failure inside `docker
      # build` arrives wrapped in build output.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test
        env:
          # Same URL tests/test-db-url.ts defaults to; set explicitly so a
          # change to the service port fails loudly here instead of silently
          # falling back.
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/docuflow_test

  image:
    runs-on: ubuntu-latest

    # One tag, named once. Every step below runs the image the step above built,
    # and the commit SHA is what keeps concurrent runs on the same runner from
    # reading each other's.
    env:
      IMAGE: docuflow:${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Layer cache keyed by the Actions cache, so an unchanged package-lock.json
      # reuses the two `npm ci` layers — the only slow part of the build.
      #
      # Only pushes to main write the cache. `mode=max` exports every intermediate
      # stage, which is what makes the `npm ci` layers reusable at all, but for an
      # image this size that is gigabytes per writing ref; letting each pull
      # request export its own copy would evict the npm cache and the image cache
      # both, under one 10 GB per-repository budget. Pull requests read main's
      # entry instead, which is the one they branched from.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          # Loaded into the runner's daemon so the steps below can run it. That
          # copies the whole image, and it buys the one thing no test can stage:
          # the runtime stage's own `npm ci --omit=dev` tree, under the image's
          # own user and working directory.
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha,scope=image
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=image' || '' }}

      # Declared is not installed, and installed is not loadable (#36).
      #
      # The runtime stage installs `dependencies` and nothing else, and
      # `tests/smoke/server-bundle.test.ts` is what keeps that list equal to
      # what the server bundle imports. What it cannot check is this half: that
      # every entry resolves from the image's own tree and initialises there.
      # `sharp` wants libvips, `bcrypt` a prebuilt binary for this glibc and
      # this Node — a package can be present and still throw on its first line.
      #
      # The list is read out of the image's package.json rather than written
      # here, so there is no second copy of the manifest to drift from it, and
      # `import()` rather than `require()` because openid-client and parts of
      # the OpenTelemetry SDK ship ESM only.
      - name: Every runtime dependency loads inside the image
        run: |
          docker run --rm "$IMAGE" node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const { dependencies } = JSON.parse(readFileSync("/app/package.json", "utf8"));
            const names = Object.keys(dependencies);
            const failed = [];
            for (const name of names) {
              try {
                await import(name);
              } catch (error) {
                failed.push(name + ": " + error.message);
              }
            }
            if (failed.length) {
              console.error(failed.join("\n"));
              process.exit(1);
            }
            console.log(names.length + " runtime dependencies loaded");
          '

      # The second entry point, from a container with no checkout in it (#35).
      #
      # No database is reached, and none should be: ADR-0018 keeps every real
      # URL out of this workflow. What is being proved is everything up to the
      # connection — that dist/migrate.mjs exists in the shipped image, runs as
      # ESM under `node`, resolves its externals from the runtime-only
      # dependency tree, finds the journal beside itself, and refuses in the way
      # `shared/databaseUrl.ts` says it should rather than by crashing. A
      # devDependency import or a missing `migrations/` fails here.
      - name: The migration entry point runs in the image
        run: |
          set -o pipefail
          output=$(docker run --rm "$IMAGE" \
            node dist/migrate.mjs --status 2>&1) && exit_code=0 || exit_code=$?

          echo "$output"
          if [ "$exit_code" -eq 0 ]; then
            echo "::error::migrate.mjs exited 0 with no database configured"
            exit 1
          fi
          echo "$output" | grep -q "Database not configured"

      - name: The journal shipped with it
        run: |
          docker run --rm "$IMAGE" \
            node -e "const {readdirSync}=require('node:fs');
              const files=readdirSync('/app/migrations');
              if(!files.includes('meta')) { console.error(files); process.exit(1) }
              console.log(files.filter(f=>f.endsWith('.sql')).sort().join('\n'))"

      # The default CMD, against the HEALTHCHECK the image declares. `docker run
      # --health-*` is not a thing: the check is baked in, so this waits for the
      # container's own status to leave `starting`, which is the image's answer
      # rather than a second copy of the health command written out here.
      #
      # Every value is a placeholder and none of them is reached: `/health`
      # answers before authentication and touches nothing, and both the pg pool
      # and the session store connect on first use rather than at boot. That is
      # what makes this a boot test and not a database test, and it is what
      # ADR-0018 requires — no real credential or URL belongs in this workflow.
      - name: The default command still boots
        run: |
          id=$(docker run -d \
            -e DB_DRIVER=pg \
            -e DATABASE_URL=postgresql://unused:unused@127.0.0.1:5432/unused \
            -e SESSION_SECRET=ci-placeholder-not-a-real-secret \
            -e JWT_SECRET=2026-08:ci-placeholder-not-a-real-secret-0000 \
            -e PRIVATE_OBJECT_DIR=/ci-bucket/.private \
            -e PUBLIC_OBJECT_SEARCH_PATHS=/ci-bucket/public \
            -e GCS_SERVICE_ACCOUNT_KEY='{"client_email":"ci@example.invalid","private_key":"not-a-key"}' \
            "$IMAGE")

          # `starting` until the first check outside the start period lands, so
          # this waits it out rather than reading the answer before there is one.
          health=starting
          for _ in $(seq 1 45); do
            health=$(docker inspect --format '{{.State.Health.Status}}' "$id")
            [ "$health" = "starting" ] || break
            sleep 2
          done

          # Tailed: a configuration refusal prints its list last, and ahead of it
          # is the minified bundle the stack trace points into.
          docker logs "$id" 2>&1 | tail -30
          docker rm -f "$id" >/dev/null
          [ "$health" = "healthy" ] || { echo "::error::HEALTHCHECK reported $health"; exit 1; }
