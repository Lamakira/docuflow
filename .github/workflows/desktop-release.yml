name: Desktop Agent — Release

# Triggered by pushing a tag: desktop-agent-v0.1.x
# Can also be triggered manually via workflow_dispatch (no release created).
#
# Each OS builds its artifact in parallel, then uploads to the same GitHub Release.
# The release is created as a draft — publish it manually after reviewing all artifacts.
#
# Usage (tag-based release):
#   git tag desktop-agent-v0.1.6
#   git push origin desktop-agent-v0.1.6
#
# Usage (manual dry-run, no release upload):
#   GitHub → Actions → Desktop Agent — Release → Run workflow

on:
  push:
    tags:
      - 'desktop-agent-v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — build only, do not upload to release'
        required: false
        default: 'true'
        type: boolean

permissions:
  contents: write

env:
  # Opt into Node.js 24 runner actions now to avoid forced migration on 2026-06-02
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  # ── Windows — NSIS .exe ────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: desktop-agent/package-lock.json

      - name: Install dependencies
        working-directory: desktop-agent
        run: npm install

      - name: Build Windows installer
        working-directory: desktop-agent
        run: npm run dist:win

      - name: Upload artifact (always — for inspection)
        uses: actions/upload-artifact@v5
        with:
          name: windows-installer
          path: desktop-agent/release/DocuFlow-Agent-*-windows-setup.exe
          retention-days: 7

      - name: Upload to GitHub Release (draft)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: desktop-agent/release/DocuFlow-Agent-*-windows-setup.exe
          body: |
            ## v0.1.6 — Idle alert + auto-stop flow

            **What's new:**
            - Idle prompt now shows a live countdown (configurable 15–120 s, default 60 s)
            - Timer auto-stops when countdown reaches zero — idle time is never counted as work
            - "I'm on break" immediately stops the timer; "Back to work" resumes correctly
            - Admin can configure idle timeout, countdown, and screenshot intervals in Settings → Desktop Agent

            | Platform | Artifact | Status |
            |----------|----------|--------|
            | Windows 10/11 | `DocuFlow-Agent-0.1.6-windows-setup.exe` | ✅ Stable |
            | macOS 12+ (Apple Silicon / Intel via Rosetta) | `DocuFlow-Agent-0.1.6-macos.dmg` | 🔶 Beta |
            | Ubuntu 20.04+ | `DocuFlow-Agent-0.1.6-linux-amd64.deb` | 🧪 Experimental |

            > **macOS note:** Built on Apple Silicon (arm64). Runs natively on M1/M2/M3 and via Rosetta 2 on Intel Macs.

  # ── macOS — DMG (arm64, unsigned) ─────────────────────────────────────────
  #
  # CI produces an unsigned DMG artifact.
  # Final signing + notarization is done locally on a Mac before distribution.
  #
  # To sign locally:
  #   export CSC_NAME="Developer ID Application: Your Name (TEAMID)"
  #   export APPLE_ID=... APPLE_APP_SPECIFIC_PASSWORD=... APPLE_TEAM_ID=...
  #   cd desktop-agent && npm run dist:mac
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: desktop-agent/package-lock.json

      - name: Install dependencies
        working-directory: desktop-agent
        run: npm install

      - name: Generate icons (.icns via iconutil)
        working-directory: desktop-agent
        run: node scripts/gen-icons.js

      - name: Build macOS DMG (arm64, unsigned)
        working-directory: desktop-agent
        run: npm run dist:mac

      - name: Upload artifact (always — for inspection)
        uses: actions/upload-artifact@v5
        with:
          name: macos-dmg
          path: desktop-agent/release/DocuFlow-Agent-*-macos.dmg
          retention-days: 7

      - name: Upload to GitHub Release (draft)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: desktop-agent/release/DocuFlow-Agent-*-macos.dmg

  # ── Linux — .deb (Ubuntu) ──────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: desktop-agent/package-lock.json

      - name: Install dependencies
        working-directory: desktop-agent
        run: npm install

      - name: Build Linux .deb
        working-directory: desktop-agent
        run: npm run dist:ubuntu

      - name: Upload artifact (always — for inspection)
        uses: actions/upload-artifact@v5
        with:
          name: linux-deb
          path: desktop-agent/release/DocuFlow-Agent-*-linux-amd64.deb
          retention-days: 7

      - name: Upload to GitHub Release (draft)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: desktop-agent/release/DocuFlow-Agent-*-linux-amd64.deb
