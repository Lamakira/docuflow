name: Desktop Agent — Release

# Triggered by pushing a tag: desktop-agent-v0.1.x
# Can also be triggered manually via workflow_dispatch (no release created).
#
# Each OS builds its artifact in parallel, then uploads to the same GitHub Release.
# The release is created as a draft — publish it manually after reviewing all artifacts.
#
# Usage (tag-based release):
#   git tag desktop-agent-v0.1.4
#   git push origin desktop-agent-v0.1.4
#
# Usage (manual dry-run, no release upload):
#   GitHub → Actions → Desktop Agent — Release → Run workflow

on:
  push:
    tags:
      - 'desktop-agent-v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — build only, do not upload to release'
        required: false
        default: 'true'
        type: boolean

permissions:
  contents: write

env:
  # Opt into Node.js 24 runner actions now to avoid forced migration on 2026-06-02
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  # ── Windows — NSIS .exe ────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: desktop-agent/package-lock.json

      - name: Install dependencies
        working-directory: desktop-agent
        run: npm install

      - name: Build Windows installer
        working-directory: desktop-agent
        run: npm run dist:win

      - name: Upload artifact (always — for inspection)
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: desktop-agent/release/DocuFlow-Agent-*-windows-setup.exe
          retention-days: 7

      - name: Upload to GitHub Release (draft)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: desktop-agent/release/DocuFlow-Agent-*-windows-setup.exe
          body: |
            See [docs/DESKTOP_RELEASE_LOG.md](https://github.com/CarineEpitech/docuflow/blob/main/docs/DESKTOP_RELEASE_LOG.md) for full release notes and installation instructions.

            | Platform | Artifact | Status |
            |----------|----------|--------|
            | Windows 10/11 | `DocuFlow-Agent-*-windows-setup.exe` | ✅ Stable |
            | macOS 12+ (Apple Silicon / Intel via Rosetta) | `DocuFlow-Agent-*-macos.dmg` | 🔶 Beta |
            | Ubuntu 20.04+ | `DocuFlow-Agent-*-linux-amd64.deb` | 🧪 Experimental |

            > **macOS note:** Built on Apple Silicon (arm64). Runs natively on M1/M2/M3 and via Rosetta 2 on Intel Macs. Signed and notarized — opens without Gatekeeper prompt.

  # ── macOS — DMG (arm64, signed + notarized) ───────────────────────────────
  #
  # Required GitHub secrets (Settings → Secrets and variables → Actions):
  #   APPLE_CERTIFICATE          — base64-encoded Developer ID Application .p12
  #                                export: base64 -i certificate.p12 | pbcopy
  #   APPLE_CERTIFICATE_PASSWORD — password for the .p12
  #   APPLE_ID                   — Apple ID email used for notarization
  #   APPLE_APP_SPECIFIC_PASSWORD — app-specific password from appleid.apple.com
  #   APPLE_TEAM_ID              — 10-char team ID from developer.apple.com
  #
  # Tag releases fail immediately if any of these secrets are missing.
  # workflow_dispatch dry runs proceed without signing (unsigned build, not published).
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: desktop-agent/package-lock.json

      - name: Install dependencies
        working-directory: desktop-agent
        run: npm install

      - name: Generate icons (.icns via iconutil)
        working-directory: desktop-agent
        run: node scripts/gen-icons.js

      # Fail fast: tag releases must never ship unsigned.
      # workflow_dispatch dry_run=true is exempt (dev/test builds, not published).
      - name: Verify Apple signing secrets
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          missing=()
          [[ -z "$APPLE_ID" ]]                   && missing+=("APPLE_ID")
          [[ -z "$APPLE_APP_SPECIFIC_PASSWORD" ]] && missing+=("APPLE_APP_SPECIFIC_PASSWORD")
          [[ -z "$APPLE_TEAM_ID" ]]               && missing+=("APPLE_TEAM_ID")
          [[ -z "$APPLE_CERTIFICATE" ]]           && missing+=("APPLE_CERTIFICATE")
          [[ -z "$APPLE_CERTIFICATE_PASSWORD" ]]  && missing+=("APPLE_CERTIFICATE_PASSWORD")
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::Missing secrets for macOS signing/notarization: ${missing[*]}"
            echo "Add them at: GitHub → repo → Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "All Apple signing secrets present."

      # Import Developer ID Application certificate into a temporary keychain.
      # Skipped silently when APPLE_CERTIFICATE is not set (dry_run without credentials).
      # The temporary keychain is deleted in the cleanup step at the end.
      - name: Import Developer ID certificate into runner keychain
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [[ -z "$APPLE_CERTIFICATE" ]]; then
            echo "APPLE_CERTIFICATE not set — skipping certificate import (unsigned build)."
            exit 0
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASS=$(openssl rand -base64 24)

          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          # 6h timeout — sufficient for the longest notarization submissions
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"

          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          rm "$RUNNER_TEMP/certificate.p12"

          # Add to keychain search list and grant codesign access without UI prompt
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"

          # Expose path for cleanup step
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "Certificate imported successfully."

      - name: Build macOS DMG (arm64, signed + notarized)
        working-directory: desktop-agent
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run dist:mac

      # Verify signature and notarization on the built artifact.
      # Mounts the DMG to access the .app bundle, then unmounts.
      # Only runs when a certificate was imported (KEYCHAIN_PATH is set).
      - name: Verify signature and notarization
        if: env.KEYCHAIN_PATH != ''
        working-directory: desktop-agent
        run: |
          DMG=$(find release -name "*.dmg" | head -1)
          echo "Artifact: $DMG"

          MOUNT_DIR=$(mktemp -d)
          hdiutil attach "$DMG" -mountpoint "$MOUNT_DIR" -nobrowse -quiet
          APP=$(find "$MOUNT_DIR" -name "*.app" -maxdepth 1 | head -1)
          echo "App bundle: $APP"

          echo "--- Code signature ---"
          codesign --verify --deep --strict --verbose=2 "$APP"

          echo "--- Gatekeeper assessment ---"
          spctl --assess --type exec --verbose "$APP"

          echo "--- Entitlements ---"
          codesign -d --entitlements - "$APP" 2>&1

          hdiutil detach "$MOUNT_DIR" -quiet

          echo "--- DMG signature ---"
          codesign --verify --verbose=2 "$DMG"

          echo "All checks passed."

      # Always delete the temporary keychain, even if a previous step failed.
      - name: Delete temporary keychain
        if: always() && env.KEYCHAIN_PATH != ''
        run: security delete-keychain "$KEYCHAIN_PATH"

      - name: Upload artifact (always — for inspection)
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: desktop-agent/release/DocuFlow-Agent-*-macos.dmg
          retention-days: 7

      - name: Upload to GitHub Release (draft)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: desktop-agent/release/DocuFlow-Agent-*-macos.dmg

  # ── Linux — .deb (Ubuntu) ──────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: desktop-agent/package-lock.json

      - name: Install dependencies
        working-directory: desktop-agent
        run: npm install

      - name: Build Linux .deb
        working-directory: desktop-agent
        run: npm run dist:ubuntu

      - name: Upload artifact (always — for inspection)
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: desktop-agent/release/DocuFlow-Agent-*-linux-amd64.deb
          retention-days: 7

      - name: Upload to GitHub Release (draft)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: desktop-agent/release/DocuFlow-Agent-*-linux-amd64.deb
