name: Desktop Agent — Release

# ─────────────────────────────────────────────────────────────────────────────
# DISARMED FOR THE MIGRATION — ADR-0018, issue #60.
#
# DO NOT ADD ANY SECRET TO THIS REPOSITORY TO MAKE THIS WORKFLOW PUBLISH.
#
# ADR-0018 builds the migration in an isolated parallel environment and forbids
# this repository holding production credentials or production URLs. Publishing
# desktop installers to real users needs exactly those — a signing identity, a
# public bucket, and the production backend's URL and token — so the two cannot
# both be true, and for the length of the migration ADR-0018 wins.
#
# The investigation for #60 (2026-08-14) found the conflict was prospective and
# not actual: no secret was configured on this repository or on the old one, no
# `desktop-agent-v*` tag existed on either, no GitHub Release existed on either,
# and this workflow had never run. So nothing was removed. What changed is that
# the automatic path is gone and this header no longer asks anyone to create the
# credentials that would have made it a violation.
#
# HOW THE DISARM WORKS, so that a later edit does not undo it by accident:
# every publishing step is gated on `github.event_name == 'push'`. With no push
# trigger those steps are unreachable, and `workflow_dispatch` cannot satisfy
# that gate however its inputs are set. Restoring the tag trigger re-arms all of
# them at once. `tests/smoke/desktop-release-workflow.test.ts` fails if either
# property is lost.
#
# WHAT STILL WORKS: a manual run builds the installers for all three platforms
# and uploads them to GitHub Actions artifacts (7-day retention) for inspection.
# That is the useful half and it needs no credential at all.
#
# HOW DESKTOP RELEASES ACTUALLY HAPPEN TODAY: an operator runs
# `scripts/publish-release.sh` (or `publish-release.ps1`) from a machine holding
# its own credentials, which uploads to the installer bucket and registers the
# release against a backend named by DOCUFLOW_API_URL in that operator's
# environment. That path never involved this workflow and is untouched here.
#
# WHAT RE-ARMING WOULD REQUIRE, whenever the migration reaches that point:
# a decision recorded as an ADR or an amendment to ADR-0018 naming the credential
# scope, and then the trigger below. Not the other way round.
# ─────────────────────────────────────────────────────────────────────────────
#
# Pipeline per platform, for reference — the publish half is unreachable:
#   1. Build installer artifact
#   2. Upload to GitHub Actions artifacts (always, 7-day retention, for inspection)
#   3. On tag push only — DISARMED:
#      a. Compute SHA-256 + file size
#      b. Upload artifact to GCS public bucket  (gcs: installers/v{VERSION}/{FILENAME})
#      c. Register metadata in DocuFlow backend (POST /api/internal/desktop-releases)
#
# The backend then serves:
#   GET /api/downloads/desktop/latest?platform=windows  → 302 to GCS URL
#
# Secrets those unreachable steps name. None is configured, and none may be
# added to this repository while ADR-0018 stands:
#   GCS_RELEASE_SA_KEY, INSTALLER_GCS_BUCKET, DOCUFLOW_API_URL,
#   DESKTOP_RELEASE_CI_TOKEN
#
# Four more are named by this file no longer: APPLE_ID,
# APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID and CSC_NAME reached the macOS
# *build* step, which carried no gate at all, so removing the tag trigger would
# have left them consumable by a manual run. They are gone rather than gated,
# because signing is the production-reaching half and building is the half worth
# keeping. The DMG a manual run produces is unsigned, as it already was.
#
# Usage (build only — the only thing this can now do):
#   GitHub → Actions → Desktop Agent — Release → Run workflow

on:
  # The `push` trigger is deliberately absent (#60). See the header: removing it
  # is what makes every publishing step below unreachable. Do not restore it
  # without the recorded decision that header describes.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Vestigial — this workflow can no longer publish (#60). Builds either way.'
        required: false
        default: 'true'
        type: boolean

# No GitHub Release created → no contents:write needed.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# ── The publish gate ──────────────────────────────────────────────────────────
# Every publishing step below carries, verbatim:
#
#   if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
#
# There is no `SHOULD_PUBLISH` variable — an earlier comment here described one
# and the file never had it. The condition above is the whole mechanism, and
# with the push trigger removed (#60) it is unsatisfiable: a manual dispatch is
# `workflow_dispatch`, never `push`, whatever `dry_run` is set to.

jobs:

  # ── Windows — NSIS .exe ─────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: desktop-agent/package-lock.json

      - name: Install dependencies
        working-directory: desktop-agent
        run: npm install

      - name: Build Windows installer
        working-directory: desktop-agent
        run: npm run dist:win

      - name: Upload artifact (always — for inspection)
        uses: actions/upload-artifact@v5
        with:
          name: windows-installer
          path: desktop-agent/release/DocuFlow-Agent-*-windows-setup.exe
          retention-days: 7

      # ── Publish steps — tag push only ────────────────────────────────────

      - name: Resolve artifact metadata
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        id: meta
        shell: pwsh
        run: |
          $file = Get-ChildItem "desktop-agent/release" -Filter "*-windows-setup.exe" |
                    Sort-Object LastWriteTime -Descending |
                    Select-Object -First 1
          if (-not $file) { Write-Error "No .exe found in desktop-agent/release"; exit 1 }

          $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
          $size = $file.Length
          $version = "${{ github.ref_name }}" -replace '^desktop-agent-v', ''

          "filename=$($file.Name)"  | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          "sha256=$hash"            | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          "size=$size"              | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          "version=$version"        | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT

          Write-Output "Artifact : $($file.Name)"
          Write-Output "SHA-256  : $hash"
          Write-Output "Size     : $size bytes"
          Write-Output "Version  : $version"

      - name: Authenticate to Google Cloud
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCS_RELEASE_SA_KEY }}

      - name: Upload installer to GCS
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: google-github-actions/upload-cloud-storage@v2
        with:
          path: desktop-agent/release/${{ steps.meta.outputs.filename }}
          destination: ${{ secrets.INSTALLER_GCS_BUCKET }}/installers/v${{ steps.meta.outputs.version }}
          headers: |-
            content-type: application/octet-stream
            cache-control: public, max-age=31536000, immutable

      - name: Register release in DocuFlow
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          DOCUFLOW_API_URL:           ${{ secrets.DOCUFLOW_API_URL }}
          DESKTOP_RELEASE_CI_TOKEN:   ${{ secrets.DESKTOP_RELEASE_CI_TOKEN }}
          INSTALLER_GCS_BUCKET:       ${{ secrets.INSTALLER_GCS_BUCKET }}
        run: |
          $body = @{
            version    = "${{ steps.meta.outputs.version }}"
            platform   = "windows"
            filename   = "${{ steps.meta.outputs.filename }}"
            storageUrl = "https://storage.googleapis.com/$env:INSTALLER_GCS_BUCKET/installers/v${{ steps.meta.outputs.version }}/${{ steps.meta.outputs.filename }}"
            fileSize   = [int64]"${{ steps.meta.outputs.size }}"
            sha256     = "${{ steps.meta.outputs.sha256 }}"
          } | ConvertTo-Json -Compress

          Write-Output "Registering with DocuFlow backend..."
          $response = Invoke-RestMethod `
            -Uri        "$env:DOCUFLOW_API_URL/api/internal/desktop-releases" `
            -Method     POST `
            -Headers    @{ Authorization = "Bearer $env:DESKTOP_RELEASE_CI_TOKEN"; "Content-Type" = "application/json" } `
            -Body       $body `
            -ErrorAction Stop

          Write-Output "Registered: $($response | ConvertTo-Json -Compress)"


  # ── macOS — DMG (arm64, unsigned in CI) ─────────────────────────────────────
  #
  # CI produces an unsigned DMG. Signing + notarization requires a paid Apple
  # Developer account and a "Developer ID Application" certificate. If you add
  # Apple secrets (APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID,
  # CSC_NAME) to the repo, the notarize.js afterSign hook runs automatically.
  #
  # Without Apple secrets the DMG is usable but macOS Gatekeeper will show
  # "unidentified developer" — users must right-click → Open the first time.
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: desktop-agent/package-lock.json

      - name: Install dependencies
        working-directory: desktop-agent
        run: npm install

      - name: Generate icons (.icns via iconutil)
        working-directory: desktop-agent
        run: node scripts/gen-icons.js

      - name: Build macOS DMG (arm64) — unsigned
        working-directory: desktop-agent
        # Apple signing and notarization are deliberately absent (#60, ADR-0018).
        #
        # This step used to receive APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD,
        # APPLE_TEAM_ID and CSC_NAME, and — unlike every publishing step below —
        # it carried no `if:`, so a plain manual run consumed them. That made it
        # the one place where removing the tag trigger did not close the path:
        # an Apple signing identity is a production credential, and ADR-0018 says
        # this repository holds none. Nothing was lost by removing them, because
        # none was ever configured; the DMG was already unsigned and now says so.
        #
        # Restoring them needs the recorded decision the header describes, and
        # a gate — this step has none.
        run: npm run dist:mac

      - name: Upload artifact (always — for inspection)
        uses: actions/upload-artifact@v5
        with:
          name: macos-dmg
          path: desktop-agent/release/DocuFlow-Agent-*-macos.dmg
          retention-days: 7

      # ── Publish steps — tag push only ────────────────────────────────────

      - name: Resolve artifact metadata
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        id: meta
        run: |
          FILE=$(ls desktop-agent/release/DocuFlow-Agent-*-macos.dmg 2>/dev/null | head -1)
          if [ -z "$FILE" ]; then echo "No .dmg found in desktop-agent/release" >&2; exit 1; fi

          FILENAME=$(basename "$FILE")
          SHA256=$(shasum -a 256 "$FILE" | awk '{print $1}')
          SIZE=$(stat -f%z "$FILE")
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#desktop-agent-v}"

          echo "filename=$FILENAME" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256"     >> "$GITHUB_OUTPUT"
          echo "size=$SIZE"         >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"   >> "$GITHUB_OUTPUT"

          echo "Artifact : $FILENAME"
          echo "SHA-256  : $SHA256"
          echo "Size     : $SIZE bytes"
          echo "Version  : $VERSION"

      - name: Authenticate to Google Cloud
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCS_RELEASE_SA_KEY }}

      - name: Upload installer to GCS
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: google-github-actions/upload-cloud-storage@v2
        with:
          path: desktop-agent/release/${{ steps.meta.outputs.filename }}
          destination: ${{ secrets.INSTALLER_GCS_BUCKET }}/installers/v${{ steps.meta.outputs.version }}
          headers: |-
            content-type: application/octet-stream
            cache-control: public, max-age=31536000, immutable

      - name: Register release in DocuFlow
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          DOCUFLOW_API_URL:           ${{ secrets.DOCUFLOW_API_URL }}
          DESKTOP_RELEASE_CI_TOKEN:   ${{ secrets.DESKTOP_RELEASE_CI_TOKEN }}
          INSTALLER_GCS_BUCKET:       ${{ secrets.INSTALLER_GCS_BUCKET }}
        run: |
          STORAGE_URL="https://storage.googleapis.com/${INSTALLER_GCS_BUCKET}/installers/v${{ steps.meta.outputs.version }}/${{ steps.meta.outputs.filename }}"

          curl -sS --fail-with-body \
            -X POST "${DOCUFLOW_API_URL}/api/internal/desktop-releases" \
            -H "Authorization: Bearer ${DESKTOP_RELEASE_CI_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary "$(jq -n \
              --arg version  "${{ steps.meta.outputs.version }}" \
              --arg platform "macos" \
              --arg filename "${{ steps.meta.outputs.filename }}" \
              --arg url      "$STORAGE_URL" \
              --argjson size "${{ steps.meta.outputs.size }}" \
              --arg sha256   "${{ steps.meta.outputs.sha256 }}" \
              '{version:$version, platform:$platform, filename:$filename, storageUrl:$url, fileSize:$size, sha256:$sha256}'
            )"

          echo ""
          echo "macOS release registered at ${STORAGE_URL}"


  # ── Linux — .deb (Ubuntu) ───────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: desktop-agent/package-lock.json

      - name: Install dependencies
        working-directory: desktop-agent
        run: npm install

      - name: Build Linux .deb
        working-directory: desktop-agent
        run: npm run dist:ubuntu

      - name: Upload artifact (always — for inspection)
        uses: actions/upload-artifact@v5
        with:
          name: linux-deb
          path: desktop-agent/release/DocuFlow-Agent-*-linux-amd64.deb
          retention-days: 7

      # ── Publish steps — tag push only ────────────────────────────────────

      - name: Resolve artifact metadata
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        id: meta
        run: |
          FILE=$(ls desktop-agent/release/DocuFlow-Agent-*-linux-amd64.deb 2>/dev/null | head -1)
          if [ -z "$FILE" ]; then echo "No .deb found in desktop-agent/release" >&2; exit 1; fi

          FILENAME=$(basename "$FILE")
          SHA256=$(sha256sum "$FILE" | awk '{print $1}')
          SIZE=$(stat -c%s "$FILE")
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#desktop-agent-v}"

          echo "filename=$FILENAME" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256"     >> "$GITHUB_OUTPUT"
          echo "size=$SIZE"         >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"   >> "$GITHUB_OUTPUT"

          echo "Artifact : $FILENAME"
          echo "SHA-256  : $SHA256"
          echo "Size     : $SIZE bytes"
          echo "Version  : $VERSION"

      - name: Authenticate to Google Cloud
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCS_RELEASE_SA_KEY }}

      - name: Upload installer to GCS
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: google-github-actions/upload-cloud-storage@v2
        with:
          path: desktop-agent/release/${{ steps.meta.outputs.filename }}
          destination: ${{ secrets.INSTALLER_GCS_BUCKET }}/installers/v${{ steps.meta.outputs.version }}
          headers: |-
            content-type: application/octet-stream
            cache-control: public, max-age=31536000, immutable

      - name: Register release in DocuFlow
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          DOCUFLOW_API_URL:           ${{ secrets.DOCUFLOW_API_URL }}
          DESKTOP_RELEASE_CI_TOKEN:   ${{ secrets.DESKTOP_RELEASE_CI_TOKEN }}
          INSTALLER_GCS_BUCKET:       ${{ secrets.INSTALLER_GCS_BUCKET }}
        run: |
          STORAGE_URL="https://storage.googleapis.com/${INSTALLER_GCS_BUCKET}/installers/v${{ steps.meta.outputs.version }}/${{ steps.meta.outputs.filename }}"

          curl -sS --fail-with-body \
            -X POST "${DOCUFLOW_API_URL}/api/internal/desktop-releases" \
            -H "Authorization: Bearer ${DESKTOP_RELEASE_CI_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary "$(jq -n \
              --arg version  "${{ steps.meta.outputs.version }}" \
              --arg platform "linux" \
              --arg filename "${{ steps.meta.outputs.filename }}" \
              --arg url      "$STORAGE_URL" \
              --argjson size "${{ steps.meta.outputs.size }}" \
              --arg sha256   "${{ steps.meta.outputs.sha256 }}" \
              '{version:$version, platform:$platform, filename:$filename, storageUrl:$url, fileSize:$size, sha256:$sha256}'
            )"

          echo ""
          echo "Linux release registered at ${STORAGE_URL}"
