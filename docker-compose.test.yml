services:
  test-db:
    # pgvector, not plain postgres: document_embeddings.embedding and
    # company_document_embeddings.embedding are vector(1536) columns that the
    # retrieval paths insert into and order by.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: docuflow_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d docuflow_test"]
      interval: 2s
      timeout: 3s
      retries: 15
